<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CourseVault Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: -apple-system, sans-serif; background:#0e0e10; color:#f2f2f2; padding:20px; }
  input, textarea { width:100%; padding:10px; margin-bottom:12px; border-radius:8px; border:1px solid #333; background:#1a1a1d; color:#fff; box-sizing:border-box; }
  label { font-size:13px; color:#aaa; }
  button { padding:12px 20px; border:none; border-radius:8px; background:#4f46e5; color:#fff; font-weight:600; width:100%; }
  #status { margin-top:12px; font-size:14px; }
  #gate { max-width:400px; margin:100px auto; text-align:center; }
</style>
</head>
<body>

<div id="gate">
  <h2>Admin Login</h2>
  <input type="password" id="pw" placeholder="Enter admin password" />
  <button onclick="checkPw()">Enter</button>
</div>

<div id="panel" style="display:none; max-width:500px; margin:0 auto;">
  <h2>Add New Course</h2>
  <label>Title</label>
  <input id="title" />
  <label>Description</label>
  <textarea id="description" rows="3"></textarea>
  <label>Price (NGN)</label>
  <input id="price" type="number" />
  <label>Cover image URL (from Lovart, upload image somewhere first e.g. imgbb.com and paste link)</label>
  <input id="cover_url" />
  <label>PDF file URL (upload PDF to Supabase Storage first, paste link here)</label>
  <input id="pdf_url" />
  <button onclick="addProduct()">Publish Course</button>
  <div id="status"></div>
</div>

<script>
const supabaseUrl = "YOUR_SUPABASE_URL";
const supabaseKey = "YOUR_SUPABASE_ANON_KEY";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
const ADMIN_PASSWORD = "Hushwire14$";

function checkPw() {
  if (document.getElementById('pw').value === ADMIN_PASSWORD) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
  } else {
    alert("Wrong password");
  }
}

async function addProduct() {
  const title = document.getElementById('title').value;
  const description = document.getElementById('description').value;
  const price = document.getElementById('price').value;
  const cover_url = document.getElementById('cover_url').value;
  const pdf_url = document.getElementById('pdf_url').value;

  if (!title || !price || !pdf_url) { alert("Fill title, price, and PDF link at least."); return; }

  const { error } = await supabase.from('products').insert([{ title, description, price, cover_url, pdf_url }]);
  document.getElementById('status').innerText = error ? "Error: " + error.message : "Course published successfully!";
  if (!error) {
    document.getElementById('title').value = '';
    document.getElementById('description').value = '';
    document.getElementById('price').value = '';
    document.getElementById('cover_url').value = '';
    document.getElementById('pdf_url').value = '';
  }
}
</script>
</body>
  </html>
